name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  prepare:
    name: Prepare formatted source and lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --all

      - name: Resolve lockfile for both targets
        run: cargo generate-lockfile

      - name: Upload prepared source
        uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: |
            Cargo.toml
            Cargo.lock
            src
          if-no-files-found: error

  linux:
    name: Linux TUI
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: .

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --locked --features tui --bin padsound --lib --tests -- -D warnings

      - name: Test
        run: cargo test --locked --features tui

      - name: Release build
        run: cargo build --release --locked --features tui --bin padsound

  windows:
    name: Windows GUI
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy Windows GUI
        run: cargo clippy --locked --no-default-features --features windows-gui --bin padsound-gui --lib --tests -- -D warnings

      - name: Test shared library
        run: cargo test --locked --no-default-features --features windows-gui --lib

      - name: Release build
        run: cargo build --release --locked --no-default-features --features windows-gui --bin padsound-gui
