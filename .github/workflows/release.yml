name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked --features tui --bin padsound

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="padsound-v${version}-linux-x86_64"
          mkdir -p "dist/${package}"
          cp target/release/padsound "dist/${package}/"
          cp README.md LICENSE padsound.example.toml "dist/${package}/"
          cp -R example "dist/${package}/example"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Publish Linux artifact
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz

  windows:
    name: Windows GUI release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked --no-default-features --features windows-gui --bin padsound-gui

      - name: Package
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $package = "padsound-v$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/release/padsound-gui.exe" "dist/$package/"
          Copy-Item README.md, LICENSE, padsound.example.toml "dist/$package/"
          Copy-Item example "dist/$package/example" -Recurse
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - name: Publish Windows artifact
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
