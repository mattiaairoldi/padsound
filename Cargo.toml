[package]
name = "padsound"
version = "0.3.0-alpha.1"
edition = "2024"
description = "Cross-platform audio trigger for live theatre use"
license = "MIT"
readme = "README.md"

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:ratatui"]
windows-gui = ["dep:eframe", "dep:windows-sys"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
crossbeam-channel = "0.5"
crossterm = { version = "0.29", optional = true }
midir = "0.10"
ratatui = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", features = ["all"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.1", optional = true, default-features = false, features = ["default_fonts", "glow"] }
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "padsound"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "padsound-gui"
path = "src/bin/padsound-gui.rs"
required-features = ["windows-gui"]
